#
# SPDX-License-Identifier: MIT

version = 1

# Binary data, verbatim text, and configurations that cannot be annotated 
# by format.
[[annotations]]
path = [
  "dev_scripts/codegen/snippets/*",
  "dev_scripts/continuous_integration_of_dev_scripts/pylint.rc",
  "doc/**/*.ico", 
  "doc/**/*.png",
  "src/AdditionalVerbsInImperativeMood.txt",
  "src/aas-core3.2-csharp.slnx.DotSettings",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.2-csharp AUTHORS"
SPDX-License-Identifier = "MIT"

# Test data and the recorded test outputs are generated and compared
# byte-by-byte, JSON can not carry a comment, and the update script reads
# the revision file.
[[annotations]]
path = ["test_data/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.2-csharp AUTHORS"
SPDX-License-Identifier = "MIT"

# The list of authors, which is plain prose.
[[annotations]]
path = ["AUTHORS"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 aas-core3.2-csharp AUTHORS"
SPDX-License-Identifier = "MIT"

# The documentation which are markdown files.
[[annotations]]
path = ["README.md", "doc/**/*.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 aas-core3.2-csharp AUTHORS"
SPDX-License-Identifier = "MIT"

# The meta-model and the code generated from it transcribe the AAS
# specification: the docstrings and the doc comments derived from them quote
# the definitions of the classes, attributes and constraints. That text keeps
# the license of the specification, next to the MIT license of our own code.
# The specifications published by IDTA are licensed under CC BY 4.0.
[[annotations]]
path = [
    "dev_scripts/codegen/meta_model.py",
    "src/AasCore.Aas3_2/types.cs",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Industrial Digital Twin Association e. V."
SPDX-License-Identifier = "CC-BY-4.0"
